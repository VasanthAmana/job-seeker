name: jobseek-tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # jobseek's own tools/MCP server are pure stdlib (see README.md
      # "Install"); pytest is the only extra dependency its test suites need.
      - name: Install test dependencies
        run: pip install pytest

      - name: tests
        run: python -m pytest tests -q

      - name: expand/tests
        working-directory: expand
        run: python -m pytest tests -q

      # 7 tests here are skipped, not failing: they need a real LaTeX engine,
      # pandoc, and pdftotext, none of which this workflow installs. See the
      # workflow's original pull request (workie PR 17) for why those tools stay
      # out of CI.
      - name: tailor + dashboard tests
        run: python -m pytest tailor/tests dashboard/tests -q
