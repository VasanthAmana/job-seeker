name: jobseek-tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # jobseek's own tools/MCP server are pure stdlib (see README.md
      # "Install"); pytest is the only extra dependency its test suites need.
      - name: Install test dependencies
        run: pip install pytest

      - name: tests
        run: python -m pytest tests -q

      - name: expand/tests
        working-directory: expand
        run: python -m pytest tests -q

      # 7 tests here are skipped, not failing: they need a real LaTeX engine,
      # pandoc, and pdftotext, none of which this workflow installs. See the
      # workflow's original pull request (workie PR 17) for why those tools stay
      # out of CI.
      - name: tailor + dashboard tests
        run: python -m pytest tailor/tests dashboard/tests -q

  node:
    # The TypeScript engine (execution plan sections 5 and 6), on every
    # platform the release runs on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The port-parity suite (execution plan section 4.1) runs the Python
      # originals next to their TypeScript ports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      # Runs the Vitest suites: the ported unit specs, the Python parity
      # check, and the MCP acceptance scenarios (AT-0.x, AT-1.x), which spawn
      # the built `job-seeker mcp` over stdio against temporary data
      # directories and fictional fixtures.
      - run: npm test

  scans:
    # Public-repository guards (execution plan section 2, rule 3): fixtures
    # stay fictional and no credential reaches the index.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fixture-hygiene scan
        run: python3 scripts/ci/fixture_hygiene.py

      - name: Secret scan
        run: python3 scripts/ci/secret_scan.py
